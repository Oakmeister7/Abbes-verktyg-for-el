<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Test: Nord Pool UMM</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px;color:#1a2b22}
h1{font-size:20px}
.box{border-radius:12px;padding:16px;margin:12px 0;font-size:17px}
.ok{background:#e6f6ec;border:2px solid #1f8a4c}
.fel{background:#fdeaea;border:2px solid #c0392b}
.vant{background:#f2f4f3;border:2px solid #aab}
small{color:#556}
pre{white-space:pre-wrap;font-size:12px;background:#f6f7f6;padding:8px;border-radius:8px}
</style>
</head>
<body>
<h1>Test: får sidan hämta från Nord Pool?</h1>
<div id="t1" class="box vant">Test 1 (alla meddelanden): kör…</div>
<div id="t2" class="box vant">Test 2 (bara SE3, aktiva): kör…</div>
<p><small>Skicka en skärmbild av den här sidan till Claude. Ingen data sparas.</small></p>
<script>
async function test(id, url, namn){
  const el = document.getElementById(id);
  const t0 = performance.now();
  try {
    const r = await fetch(url);
    const ms = Math.round(performance.now() - t0);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const f = (j.items || [])[0] || {};
    el.className = 'box ok';
    el.innerHTML = '✅ <b>' + namn + ': FUNGERAR</b><br>Svar på ' + ms + ' ms. Totalt ' + j.total + ' meddelanden.<br><small>Senaste: ' + (f.publisherName || '?') + ', publicerat ' + (f.publicationDate || '?') + '</small>';
  } catch (e) {
    el.className = 'box fel';
    el.innerHTML = '❌ <b>' + namn + ': BLOCKERAT</b><br>' + e.message + '<br><small>"Failed to fetch"/"Load failed" betyder oftast att Nord Pool inte tillåter anrop från andra webbplatser (CORS).</small>';
  }
}
test('t1', 'https://ummapi.nordpoolgroup.com/messages?limit=1', 'Test 1');
test('t2', 'https://ummapi.nordpoolgroup.com/messages?limit=1&areas=10Y1001A1001A46L&status=Active', 'Test 2');
</script>
</body>
</html>
