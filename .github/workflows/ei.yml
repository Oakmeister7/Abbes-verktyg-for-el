name: Hämta Ei Läget på elmarknaden

on:
  schedule:
    - cron: "41 */3 * * *"   # var 3:e timme (UTC). Ei publicerar oftast tisdagar.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ei
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installera pdftotext
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Hämta och skriv ei.js
        run: python3 skript/ei.py ei.js
      - name: Spärr – bara ei.js får ändras
        run: |
          andrade=$(git status --porcelain | awk '{print $2}' | grep -v '^ei.js$' || true)
          if [ -n "$andrade" ]; then echo "Andra filer ändrade: $andrade"; exit 1; fi
      - name: Committa och pusha om ändrat
        run: |
          if git diff --quiet -- ei.js && git ls-files --error-unmatch ei.js >/dev/null 2>&1; then
            echo "Ingen ändring."; exit 0
          fi
          git config user.name "ei-bot"
          git config user.email "ei-bot@users.noreply.github.com"
          git add ei.js
          git commit -m "Ei Läget på elmarknaden: uppdatering $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
