name: Uppdatera data

# Startas i första hand utifrån (cron-job.org -> workflow_dispatch), varje timme 06–22 svensk tid.
# GitHubs eget schema nedan är bara reserv – GitHub kan fördröja eller tappa schemalagda körningar.
on:
  workflow_dispatch:
    inputs:
      simulera_fel:
        description: "Test: låtsas att en källa är nere (umm, ei, pris eller produktion). Lämna tomt normalt."
        required: false
        default: ""
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: uppdatera
  cancel-in-progress: false

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIMULERA_FEL: ${{ github.event.inputs.simulera_fel }}
    steps:
      - uses: actions/checkout@v4

      - name: Installera pdftotext (för Ei:s PDF)
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) >/dev/null

      - name: Nord Pool – driftmeddelanden (umm.js)
        id: umm
        continue-on-error: true
        run: python3 skript/umm.py umm.js

      - name: Ei – Läget på elmarknaden (ei.js)
        id: ei
        continue-on-error: true
        run: python3 skript/ei.py ei.js

      - name: Spotpris idag och imorgon (pris.js)
        id: pris
        continue-on-error: true
        run: python3 skript/pris.py

      - name: Kontrollera datafilerna, stäm av mot faktisk produktion och skriv status.js
        id: status
        env:
          UTFALL_UMM: ${{ steps.umm.outcome }}
          UTFALL_EI: ${{ steps.ei.outcome }}
          UTFALL_PRIS: ${{ steps.pris.outcome }}
        run: python3 skript/status.py

      - name: Spärr – bara datafilerna får ändras
        run: |
          andrade=$(git status --porcelain | sed 's/^...//' | grep -v -E '^(umm|ei|pris|status)\.js$' || true)
          if [ -n "$andrade" ]; then echo "Andra filer ändrade: $andrade"; exit 1; fi

      - name: Committa och pusha om något ändrats
        run: |
          for f in umm.js ei.js pris.js status.js; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Ingen ändring."; exit 0
          fi
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git commit -m "Data: uppdatering $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      - name: Markera körningen som misslyckad om en källa föll
        if: steps.status.outputs.fel != '' || steps.status.outcome != 'success'
        run: |
          echo "Källor som föll: ${{ steps.status.outputs.fel }} (status-steget: ${{ steps.status.outcome }})"
          exit 1
