name: Källtest nyheter (torrkörning, skriver inget)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Torrkörning av nyhetshämtningen (skriver inget)
        run: python3 skript/nyheter.py --torr
