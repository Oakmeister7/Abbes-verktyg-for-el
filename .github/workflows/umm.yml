name: Hämta Nord Pool UMM

on:
  schedule:
    - cron: "23 * * * *"   # varje timme (UTC), GitHub kan starta några minuter sent
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: umm
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hämta och skriv umm.js
        run: python3 skript/umm.py umm.js
      - name: Spärr – bara umm.js får ändras
        run: |
          andrade=$(git status --porcelain | awk '{print $2}' | grep -v '^umm.js$' || true)
          if [ -n "$andrade" ]; then echo "Andra filer ändrade: $andrade"; exit 1; fi
      - name: Committa och pusha om ändrat
        run: |
          if git diff --quiet -- umm.js && git ls-files --error-unmatch umm.js >/dev/null 2>&1; then
            echo "Ingen ändring."; exit 0
          fi
          git config user.name "umm-bot"
          git config user.email "umm-bot@users.noreply.github.com"
          git add umm.js
          git commit -m "Nord Pool UMM: uppdatering $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
