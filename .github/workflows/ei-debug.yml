name: Ei debug (tillfällig)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lista
        run: |
          curl -sSL -A "abbes-verktyg-ei/1.0" "https://ei.se/om-oss/nyheter/laget-pa-elmarknaden" -o lista.html; echo "status $?"; wc -c lista.html
          grep -o 'href="[^"]*laget-pa-elmarknaden---vecka-[^"]*"' lista.html | head -5
      - name: Veckosida
        run: |
          U=$(grep -o 'href="[^"]*laget-pa-elmarknaden---vecka-[^"]*"' lista.html | head -1 | sed 's/href="//;s/"$//')
          case "$U" in http*) ;; *) U="https://ei.se$U";; esac
          echo "URL: $U"
          curl -sSL -A "abbes-verktyg-ei/1.0" "$U" -o vecka.html; wc -c vecka.html
          python3 - <<'PY'
          import re, html
          t = open('vecka.html', encoding='utf-8', errors='replace').read()
          m = re.search(r'<main.*?</main>', t, re.S)
          body = m.group(0) if m else t
          txt = re.sub(r'<script.*?</script>|<style.*?</style>', '', body, flags=re.S)
          txt = html.unescape(re.sub(r'<[^>]+>', '\n', txt))
          txt = '\n'.join(l.strip() for l in txt.splitlines() if l.strip())
          i = txt.find('Läget på elmarknaden - vecka')
          print(txt[max(0,i-200):i+3000])
          print('PDF-länkar:', re.findall(r'href="([^"]+\.pdf)"', t)[:3])
          PY
      - name: PDF
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          which pdftotext
          P=$(grep -o 'href="[^"]*\.pdf"' vecka.html | head -1 | sed 's/href="//;s/"$//')
          case "$P" in http*) ;; *) P="https://ei.se$P";; esac
          echo "PDF: $P"
          curl -sSL -A "abbes-verktyg-ei/1.0" "$P" -o r.pdf; wc -c r.pdf
          pdftotext -layout r.pdf r.txt
          grep -n -i -B2 -A8 'magasin' r.txt | head -80
          echo ======== SPOT
          grep -n -i -A12 'Tabell 3' r.txt | head -40
