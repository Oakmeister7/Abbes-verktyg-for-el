<style>
:root,[data-theme="light"]{--bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#0f5c4a;--accent-soft:#ecfdf5;--on:#fff;--err:#b91c1c;--err-bg:#fef2f2;--input:#fff}
[data-theme="dark"]{--bg:#0f1419;--surface:#18212f;--border:#2a3648;--text:#f1f5f9;--muted:#94a3b8;--accent:#34d399;--accent-soft:rgba(52,211,153,.12);--on:#06281e;--err:#fca5a5;--err-bg:rgba(239,68,68,.12);--input:#121a26}
[data-theme="isa"]{--bg:#fff2f8;--surface:#fff;--border:#fad3e5;--text:#2d0f1d;--muted:#7d4a61;--accent:#d6177f;--accent-soft:#fde4f0;--on:#fff;--err:#9f1239;--err-bg:#fff1f2;--input:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.las{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
.las-ikon{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
h1{font-size:1.35rem;margin:0 0 6px}
p.under{margin:0 0 22px;color:var(--muted);font-size:.92rem;line-height:1.45}
label.f{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
input[type=password]{width:100%;padding:.75rem .9rem;border:1px solid var(--border);border-radius:10px;font-size:1rem;background:var(--input);color:var(--text);font-family:inherit;outline:none}
input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.kom{display:flex;gap:8px;align-items:center;margin:14px 0 20px;font-size:.9rem;color:var(--text)}
.kom input{width:16px;height:16px;accent-color:var(--accent)}
button{width:100%;padding:.8rem;border:0;border-radius:10px;background:var(--accent);color:var(--on);font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6;cursor:wait}
.fel{display:none;margin-top:14px;padding:.65rem .8rem;border-radius:10px;background:var(--err-bg);color:var(--err);font-size:.9rem}
.fel.syns{display:block}
.status{margin-top:14px;color:var(--muted);font-size:.9rem;min-height:1.2em}
.sign{position:fixed;right:18px;bottom:12px;font-size:.8rem;color:var(--muted);letter-spacing:.04em}
</style>
</head>
<body>
<main class="las" id="las">
  <div class="las-ikon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>Abbes verktyg för el</h1>
  <p class="under">Internt verktyg. Ange lösvordet du fått av Abbe.</p>
  <form id="form" autocomplete="on">
    <input type="text" name="username" value="abbes-verktyg-for-el" autocomplete="username" hidden />
    <label class="f" for="pw">Lösvord (lösenord)</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus />
    <label class="kom"><input type="checkbox" id="kom" checked /> Kom ihåg på den här datorn</label>
    <button type="submit" id="knapp">Lås upp</button>
    <div class="fel" id="fel" role="alert">Fel lösvord. Försök igen.</div>
    <div class="status" id="status" aria-live="polite"></div>
  </form>
  <noscript><p>JavaScript krävs för att öppna verktyget.</p></noscript>
</main>

<script>
(function(){
  var SALT='sFcYB+DiGF8iy28SXmsr4A==', IV='u9J2eKoS7ZD+GGcD', VARV=600000, NYCKEL='abbes_el_nyckel_v1';
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function tillB64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
  var form=document.getElementById('form'),pw=document.getElementById('pw'),kom=document.getElementById('kom'),
      knapp=document.getElementById('knapp'),fel=document.getElementById('fel'),status=document.getElementById('status');
  if(!(window.crypto&&crypto.subtle&&window.DecompressionStream)){status.textContent='Webbläsaren saknar stöd. Använd senaste Chrome eller Edge.';knapp.disabled=true;return;}
  try{if(/[?&]glom\b/.test(location.search)){localStorage.removeItem(NYCKEL);history.replaceState(null,'',location.pathname+location.hash);}}catch(e){}
  async function harled(los){
    var bas=await crypto.subtle.importKey('raw',new TextEncoder().encode(los),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(SALT),iterations:VARV,hash:'SHA-256'},bas,256));
  }
  async function oppna(ra){
    var nyckel=await crypto.subtle.importKey('raw',ra,{name:'AES-GCM'},false,['decrypt']);
    var gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},nyckel,b64(document.getElementById('data').textContent.trim()));
    var html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return html;
  }
  function visa(html){document.open();document.write(html);document.close();}
  form.addEventListener('submit',async function(ev){
    ev.preventDefault();fel.classList.remove('syns');knapp.disabled=true;status.textContent='Låser upp …';
    try{
      var ra=await harled(pw.value);
      var html=await oppna(ra);
      try{if(kom.checked)localStorage.setItem(NYCKEL,tillB64(ra));else localStorage.removeItem(NYCKEL);}catch(e){}
      visa(html);
    }catch(e){knapp.disabled=false;status.textContent='';fel.classList.add('syns');pw.select();}
  });
  (async function(){
    var sparad=null;try{sparad=localStorage.getItem(NYCKEL);}catch(e){}
    if(!sparad)return;
    status.textContent='Låser upp …';
    try{visa(await oppna(b64(sparad)));}
    catch(e){try{localStorage.removeItem(NYCKEL);}catch(x){}status.textContent='Lösvordet har ändrats. Ange det nya.';}
  })();
})();
</script>
